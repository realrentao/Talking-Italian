<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>意大利语流利度 1 · 第 1-50 句 · 逐句原声对照</title>
<style>
:root{
  --bg:#fbfaf7;--surface:#fff;--ink:#1f2d33;--muted:#6b7a83;--line:#e6ded0;
  --en:#1A5276;--it:#C0392B;--zh:#27865A;--gold:#D4AC0D;--cream:#FEF9E7;
  --shadow:0 6px 22px rgba(60,45,25,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.hero{position:relative;overflow:hidden;color:#fff;padding:44px 24px 38px;
  background:linear-gradient(135deg,#1A5276 0%,#C0392B 100%)}
.hero::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;
  background:#fff;opacity:.09;right:-140px;top:-190px}
.hero-inner{position:relative;max-width:1000px;margin:auto}
.hero .eyebrow{display:inline-block;padding:5px 14px;border-radius:999px;
  background:rgba(255,255,255,.16);font-size:12px;letter-spacing:2px;margin-bottom:12px}
.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px)}
.hero p{margin:0;max-width:760px;opacity:.94;font-size:14px}
.hero-stats{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.hero-stat b{display:block;font-size:22px}.hero-stat span{font-size:11px;opacity:.85;letter-spacing:1px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.bar{position:sticky;top:0;z-index:50;background:rgba(251,250,247,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 20px}
.bar-inner{max-width:1000px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar a{font-size:13px;color:var(--muted);padding:5px 12px;border-radius:999px}
.bar a:hover{background:var(--cream);color:var(--it)}
.bar .spacer{flex:1}
.bar input{flex:1;min-width:180px;padding:9px 14px;border:1px solid var(--line);
  border-radius:10px;font-size:14px;background:#fff}
.modes{display:flex;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface)}
.modes button{border:0;background:transparent;padding:7px 12px;border-radius:7px;
  font-size:13px;color:var(--muted);cursor:pointer;transition:.15s}
.modes button:hover{color:var(--it)}
.modes button.active{background:var(--it);color:#fff;font-weight:700}
.list{padding:18px 0 60px}
.row{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  margin:12px 0;box-shadow:var(--shadow)}
.num{font-size:20px;font-weight:800;color:var(--gold);text-align:center;padding-top:6px}
.cell{display:flex;flex-direction:column;gap:6px}
.line{cursor:pointer;padding:6px 10px;border-radius:9px;border-left:3px solid transparent;
  transition:background .15s,border-color .15s;user-select:none}
.line:hover{background:var(--cream)}
.line.zh{border-left-color:var(--zh)}
.line.en{border-left-color:var(--en)}
.line.it{border-left-color:var(--it)}
.line.playing{background:#f3ead2}
.line.zh.playing{border-left-color:var(--zh);border-left-width:6px}
.line.en.playing{border-left-color:var(--en);border-left-width:6px}
.line.it.playing{border-left-color:var(--it);border-left-width:6px}
.txt.zh{color:var(--ink);font-size:17px;font-weight:600}
.txt.en{color:var(--en);font-size:15px}
.txt.it{color:var(--it);font-size:15px;font-weight:600}
.txt.ipa{color:var(--muted);font-size:12px;letter-spacing:.3px;padding:0 10px;font-style:italic}
.tag{font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:5px;
  background:var(--cream);color:var(--muted);margin-right:6px;vertical-align:2px}
.line.playing .tag{background:#fff;color:var(--gold)}
.row.hide-en .line.en,.row.hide-zh .line.zh{display:none}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 40px}
</style>
</head>
<body>
<div class="hero"><div class="hero-inner">
  <span class="eyebrow">GLOSSIKA · ITALIAN FLUENCY 1 · GMS-B-0001</span>
  <h1>意大利语流利度 1 · 第 1–50 句</h1>
  <p>逐句原声对照。英语与意大利语发音均从你提供的 <b>ENIT-F1-GMS-B-0001.mp3</b> 精确截取；中文配音为 edge-tts 年轻男声（云希）。点击任意句子即可听对应发音。</p>
  <div class="hero-stats">
    <div class="hero-stat"><b>50</b><span>句</span></div>
    <div class="hero-stat"><b>150</b><span>音频片段</span></div>
    <div class="hero-stat"><b>1</b><span>原声来源</span></div>
  </div>
</div></div>

<div class="bar"><div class="bar-inner">
  <input id="q" type="text" placeholder="搜索英文 / 意大利语 / 中文…">
  <div class="modes">
    <button data-m="all" class="active">三语</button>
    <button data-m="zh-it">中意</button>
    <button data-m="it">仅意语</button>
  </div>
  <div class="spacer"></div>
  <a href="../index.html">← Glossika 书架</a>
</div></div>

<div class="wrap">
  <div class="list" id="list"></div>
</div>
<div class="foot">英语 / 意大利语音频仅来自用户提供的 mp3 · 中文配音 edge-tts zh-CN-YunxiNeural</div>

<script src="data.js"></script>
<script>
(function(){
  var S = (window.F1_DATA && window.F1_DATA.sentences) || [];
  var list = document.getElementById('list');
  var q = document.getElementById('q');
  var mode = 'all';
  var audio = null, curLine = null;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  function stopCur(){
    if(audio){audio.pause();audio=null;}
    if(curLine){curLine.classList.remove('playing');curLine=null;}
  }
  function applyMode(d, m){
    d.classList.toggle('hide-en', m !== 'all');
    d.classList.toggle('hide-zh', m === 'it');
  }
  function play(line, src){
    if(curLine===line){stopCur();return;}
    stopCur();
    audio = new Audio(src);
    curLine = line; line.classList.add('playing');
    audio.onended = stopCur;
    audio.onerror = stopCur;
    audio.play();
  }
  function render(filter){
    filter = (filter||'').toLowerCase().trim();
    stopCur();
    list.innerHTML='';
    S.forEach(function(s){
      var hay = (s.en+' '+s.it+' '+s.zh+' '+(s.ipa||'')).toLowerCase();
      if(filter && hay.indexOf(filter)<0) return;
      var d=document.createElement('div'); d.className='row';
      applyMode(d, mode);
      d.innerHTML =
        '<div class="num">'+s.n+'</div>'+
        '<div class="cell">'+
          '<div class="line zh" data-src="'+s.zhAudio+'"><div class="txt zh"><span class="tag">中</span>'+esc(s.zh)+'</div></div>'+
          '<div class="line en" data-src="'+s.enAudio+'"><div class="txt en"><span class="tag">EN</span>'+esc(s.en)+'</div></div>'+
          '<div class="line it" data-src="'+s.itAudio+'"><div class="txt it"><span class="tag">IT</span>'+esc(s.it)+'</div></div>'+
          (s.ipa ? '<div class="txt ipa">/'+esc(s.ipa)+'/</div>' : '')+
        '</div>';
      list.appendChild(d);
    });
    list.querySelectorAll('.line').forEach(function(el){
      el.addEventListener('click',function(){play(el, el.getAttribute('data-src'));});
    });
  }
  document.querySelectorAll('.modes button').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.modes button').forEach(function(x){x.classList.remove('active');});
      btn.classList.add('active');
      mode = btn.getAttribute('data-m');
      render(q.value);
    });
  });
  q.addEventListener('input',function(){render(q.value);});
  render('');
})();
</script>
</body>
</html>
